name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Vitest suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
